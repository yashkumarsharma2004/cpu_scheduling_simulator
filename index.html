<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>CPU Scheduling Simulator</h1>
    <p>Interactive Web-based CPU Scheduling Visualizer</p>
</header>

<div class="container">

    <div class="card">
        <h2>1. Select Scheduling Algorithm</h2>
        <select id="algorithm">
            <option value="fcfs">FCFS</option>
            <option value="sjf_np">SJF (Non-Preemptive)</option>
            <option value="srtf">SJF (Preemptive - SRTF)</option>
            <option value="priority_np">Priority (Non-Preemptive)</option>
            <option value="priority_p">Priority (Preemptive)</option>
            <option value="rr">Round Robin</option>
        </select>

        <div id="quantumBox" style="display:none;">
            <label>Time Quantum:</label>
            <input type="number" id="quantum" value="2">
        </div>
    </div>

    <div class="card">
        <h2>2. Add Processes</h2>
        <div class="form-row">
            <input type="number" id="arrival" placeholder="Arrival Time">
            <input type="number" id="burst" placeholder="Burst Time">
            <input type="number" id="priority" placeholder="Priority (Lower = Higher)">
            <button onclick="addProcess()">Add</button>
        </div>

        <table id="processTable">
            <tr>
                <th>PID</th>
                <th>Arrival</th>
                <th>Burst</th>
                <th>Priority</th>
            </tr>
        </table>
    </div>

    <div class="card">
        <button class="run-btn" onclick="runSimulation()">Run Simulation</button>
    </div>

    <div class="card">
        <h2>3. Output</h2>
        <table id="resultTable">
            <tr>
                <th>PID</th>
                <th>CT</th>
                <th>TAT</th>
                <th>WT</th>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>4. Gantt Chart</h2>
        <canvas id="ganttCanvas" width="900" height="150"></canvas>
    </div>

</div>

<script src="scheduler.js"></script>
<script src="ui.js"></script>

</body>
</html>
